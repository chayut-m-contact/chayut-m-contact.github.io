<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chayut Mookda-anan · INLINE NETWORK</title>
<meta name="description" content="Overseas Sales Executive, INLINE NETWORK CO., LTD. Connect via LINE or WhatsApp.">
<meta name="theme-color" content="#F6F4EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F6B;--navy2:#13308F;--gold:#B8914A;--gold2:#E3C98F;--ink:#141826;--mute:#7A7F8F;--line:rgba(184,145,74,.35);--bg:#F6F4EE}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:32px 18px;min-height:100vh;overflow-x:hidden;position:relative}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none}
body:before{width:420px;height:420px;background:radial-gradient(circle,rgba(19,48,143,.20),transparent 70%);top:-140px;right:-120px;animation:drift 14s ease-in-out infinite alternate}
body:after{width:380px;height:380px;background:radial-gradient(circle,rgba(227,201,143,.45),transparent 70%);bottom:-140px;left:-120px;animation:drift 16s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(40px,30px) scale(1.08)}}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px;padding:46px 30px 30px;text-align:center;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 30px 80px -20px rgba(11,31,107,.22),0 2px 6px rgba(11,31,107,.05);border:1px solid rgba(255,255,255,.7)}
.card:before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:20px;pointer-events:none}
.fade{opacity:0;transform:translateY(14px);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.3s}.d4{animation-delay:.42s}.d5{animation-delay:.54s}.d6{animation-delay:.66s}
.logo{width:96px;height:auto;display:block;margin:0 auto 26px}
.eyebrow{font-size:10px;letter-spacing:.42em;color:var(--gold);font-weight:500;text-transform:uppercase;margin-bottom:14px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(26px,8vw,34px);line-height:1.05;white-space:nowrap;color:var(--navy);letter-spacing:.01em}
.role{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);margin-top:14px;font-weight:500}
.co{font-size:11px;letter-spacing:.18em;color:var(--mute);margin-top:6px}
.rule{display:flex;align-items:center;gap:12px;margin:28px auto 26px;width:150px}
.rule span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.rule i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.btn{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;border-radius:16px;text-decoration:none;margin-bottom:12px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;box-shadow:0 10px 24px -10px rgba(11,31,107,.55);transition:transform .25s ease,box-shadow .25s ease;overflow:hidden}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite}
.btn.wa:after{animation-delay:2.5s}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.btn:active{transform:scale(.98)}
@media(hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(11,31,107,.6)}}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px;fill:#fff}
.ic.line{background:#06C755}.ic.wa{background:#25D366}
.bt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;flex:1}
.bt b{font-size:15px;font-weight:600;letter-spacing:.01em}
.bt small{font-size:11px;opacity:.65;margin-top:2px;letter-spacing:.02em}
.arrow{width:18px;height:18px;opacity:.6;fill:none;stroke:#fff;stroke-width:1.8}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.row a{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px 12px;border-radius:14px;background:#fff;border:1px solid rgba(11,31,107,.08);color:var(--navy);text-decoration:none;font-size:11px;font-weight:500;letter-spacing:.06em;transition:border-color .25s,transform .25s}
@media(hover:hover){.row a:hover{border-color:var(--gold);transform:translateY(-2px)}}
.row svg{width:20px;height:20px;fill:none;stroke:var(--navy);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.addr{display:flex;gap:10px;align-items:flex-start;text-align:left;margin-top:24px;padding-top:20px;border-top:1px solid rgba(11,31,107,.07);font-size:11.5px;line-height:1.65;color:var(--mute)}
.addr svg{width:16px;height:16px;flex:none;margin-top:2px;fill:none;stroke:var(--gold);stroke-width:1.6}
.foot{margin-top:18px;font-size:9.5px;letter-spacing:.32em;color:#B0B3BE;text-transform:uppercase}
</style>
</head>
